name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        type: choice
        options: [artifact, release, latest]
        default: artifact

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'nobuild') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cpio
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio

      - name: Fetch private firmware
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -eu

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            clone --depth 1 \
            https://github.com/GayCorp/initramfs-ps4-private.git \
            "$TEMP_DIR/firmware"

          test -d "$TEMP_DIR/firmware/amdgpu"
          test -d "$TEMP_DIR/firmware/mrvl"

          mkdir -p lib/firmware

          cp -a "$TEMP_DIR/firmware/amdgpu" lib/firmware/
          cp -a "$TEMP_DIR/firmware/mrvl" lib/firmware/

          echo "Private firmware copied successfully."
          du -sh lib/firmware/amdgpu lib/firmware/mrvl

      - name: Make files executable
        run: |
          find . -path './.git' -prune -o \
            -type f -exec chmod +x {} +

      - name: Make bake.sh executable
        run: chmod +x bake.sh

      - name: Run bake.sh
        run: ./bake.sh -production

      - name: Verify archive
        run: |
          set -eu

          test -s initramfs.cpio.gz

          echo "--- Archive size ---"
          ls -lh initramfs.cpio.gz

          echo "--- Archive contents (first 20 entries) ---"
          zcat initramfs.cpio.gz | cpio -it --quiet | head -20

          echo "--- Total entries ---"
          zcat initramfs.cpio.gz | cpio -it --quiet | wc -l

          echo "--- Verify firmware is included ---"
          zcat initramfs.cpio.gz | cpio -it --quiet |
            grep -E '^(\./)?lib/firmware/(amdgpu|mrvl)/'

      - name: Determine release mode
        id: mode
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
          else
            MSG_LC="$(printf '%s' "$COMMIT_MSG" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$MSG_LC" | grep -q 'latest'; then
              MODE="latest"
            elif printf '%s' "$MSG_LC" | grep -q 'release'; then
              MODE="release"
            else
              MODE="artifact"
            fi
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Build mode: $MODE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-${{ github.sha }}
          path: initramfs.cpio.gz
          retention-days: 30

      - name: Compute release tag
        id: tag
        if: steps.mode.outputs.mode == 'release'
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          TAG="build-${SHORT_SHA}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing as $TAG"

      - name: Create GitHub Release
        if: steps.mode.outputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Build ${{ steps.tag.outputs.tag }}"
          body: |
            Automated build from commit ${{ github.sha }}.

            **Archive:** `initramfs.cpio.gz`
            **Size:** see asset below
          files: initramfs.cpio.gz
          fail_on_unmatched_files: true
          make_latest: false
          generate_release_notes: true

      - name: Update bleeding-edge "latest" release
        if: steps.mode.outputs.mode == 'latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (bleeding edge)"
          body: |
            Rolling release — always the newest successful build from `main`.

            **Commit:** ${{ github.sha }}
            **Archive:** `initramfs.cpio.gz`
          files: initramfs.cpio.gz
          fail_on_unmatched_files: true
          make_latest: true
          prerelease: false
